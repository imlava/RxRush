# Configuration for Cloudflare Pages
name = "rxrush"
compatibility_date = "2024-02-25"

# Configure build output directory with custom script
[build]
command = "bash ./cloudflare-pages-build.sh"

[build.upload]
format = "directory"

# Specify the output directory for Pages
[site]
bucket = "out"
pages_build_output_dir = "out"

# Additional environment variables
[env.production]
NODE_VERSION = "18.18.0"
