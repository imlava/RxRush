# Configuration for Cloudflare Pages
name = "rxrush"
compatibility_date = "2024-02-25"

# Configure build output directory with direct Next.js build command
[build]
command = "npx @cloudflare/next-on-pages@1"

[build.upload]
format = "directory"

# Specify the output directory for Pages
[site]
bucket = ".vercel/output/static"
pages_build_output_dir = ".vercel/output/static"

# Additional environment variables
[env.production]
NODE_VERSION = "18.18.0"
