# Configuration for Cloudflare Pages
name = "rxrush"
compatibility_date = "2024-02-25"

# Configure build using our pre-build script and next-on-pages
[build]
command = "npm run pages:build"

[build.upload]
format = "directory"

# Specify the output directory for Pages
[site]
bucket = ".vercel/output/static"
pages_build_output_dir = ".vercel/output/static"

# Handle 404 and other errors using our static HTML pages
[routes]
include = ["/*"]
exclude = ["/api/*", "/_next/*"]

[[routes.errors]]
error = [404]
status = 404
static = "404.html"

[[routes.errors]]
error = "*"
status = 500
static = "500.html"

# Additional environment variables
[env.production]
NODE_VERSION = "18.18.0"
IS_CLOUDFLARE_BUILD = "true"
